name: Validate Render Build

on:
  push:
    branches:
      - main
      - agent/build-lab-portal-mvp
      - fix/two-current-portals-full-stack
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies exactly like Render
        run: npm install --no-audit --no-fund

      - name: Build exactly like Render
        run: npm run build:render
