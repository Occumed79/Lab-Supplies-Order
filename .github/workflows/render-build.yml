name: Validate Render Build

on:
  push:
    branches:
      - main
      - agent/build-lab-portal-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies exactly like Render
        run: npm install --no-audit --no-fund

      - name: Build exactly like Render
        run: npm run build:render

      - name: Smoke test Render runtime
        run: |
          PORT=4173 npm start > /tmp/render-runtime.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/render-runtime.log
          exit 1
