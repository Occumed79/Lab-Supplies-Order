name: Validate Lab Portal

on:
  pull_request:
  push:
    branches:
      - "agent/**"

concurrency:
  group: validate-lab-portal-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build clinic portal
        run: npm run build
        env:
          VITE_APP_MODE: clinic

      - name: Build admin portal
        run: npm run build
        env:
          VITE_APP_MODE: admin
          VITE_CLINIC_APP_URL: https://lab-supplies-order.onrender.com

      - name: Check backend syntax
        run: node --check backend/server.js && node --check backend/catalog-launcher.js
